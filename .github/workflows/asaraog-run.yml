name: asaraog-run
on:
  workflow_dispatch:
    inputs:
      ref: {required: true}
      args: {required: true}
env:
  LANGFUSE_BASE_URL: "http://localhost:3000"
  LANGFUSE_PUBLIC_KEY: "pk-lf-test"
  LANGFUSE_SECRET_KEY: "sk-lf-test"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref }}"}
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.13"}
      - run: uv sync --locked
      - run: uv run --frozen ruff check . && uv run --frozen ruff format --check langfuse/_client/client.py tests/unit/test_mask_api_payloads.py
      - run: uv run --frozen pytest -ra ${{ inputs.args }}
